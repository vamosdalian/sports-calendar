server:
  port: 8080

rateLimit:
  requestsPerSecond: 8
  burst: 16

database:
  host: CHANGE_ME_DB_HOST
  port: 5432
  dbname: sports_calendar
  user: sports_calendar
  password: CHANGE_ME_DB_PASSWORD
  sslmode: disable

adminAuth:
  secret: CHANGE_ME_LONG_RANDOM_SECRET
  tokenTTLMinutes: 30

# The sports-spider (Transfermarkt crawler) backend. Since TheSportsDB was
# retired this is the only sync data source, so upstreamURL is REQUIRED -- the
# API refuses to start without it. It is also the target of the admin-only
# reverse proxy: the crawler is not exposed publicly; the admin "Crawler" page
# reaches it through /api/spider/* which reuses admin auth.
# On the server the spider app container is reachable on the shared docker network
# (sports-calendar-net) as http://tm_app:8000. For local dev use the host port,
# e.g. http://localhost:8001. timeoutSeconds bounds each sync HTTP call (default 30).
spider:
  upstreamURL: http://tm_app:8000
  timeoutSeconds: 30

# Public web app address, used when a calendar has to send a subscriber back to
# the site — e.g. a team feed whose slug went stale links here to re-subscribe.
# Defaults to https://sports-calendar.com when omitted.
site:
  webBaseURL: https://sports-calendar.com

# ICS fetch analytics. Calendar clients re-poll a subscribed feed on their own
# schedule, so these logs are the only honest measure of how many live
# subscriptions each feed has, and which calendar apps subscribers use.
# Raw detail rows are pruned after 90 days; the daily rollup is kept forever.
#
# subscriberSalt is mixed into the pseudonymous subscriber digest so a stored
# hash cannot be brute-forced back to an IP address (the IP itself is never
# stored). Keep it stable: changing it makes every returning client look new
# and resets the distinct-subscriber counts. Defaults to a value derived from
# adminAuth.secret.
analytics:
  enabled: true
  subscriberSalt: ""
