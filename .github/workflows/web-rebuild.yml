name: Deploy Web

# The one and only way the public site ships. Cloudflare's own Git integration
# is switched off deliberately: its build and deploy commands lived in the
# dashboard where the repo could not see them, and twice a rename in
# web/package.json broke the deploy silently — a failed build produces no
# deployment, so "nothing shipped" and "nothing was triggered" looked identical
# and only a human reading dashboard logs caught it. Everything is here now.
#
# Two triggers, because the site is a static export — fixtures and team names
# are baked into the HTML at build time — so it goes stale two different ways:
#   * code changes, handled by the push trigger;
#   * database changes (a backfilled translation, a rescheduled match), which
#     move no commits at all and would otherwise never reach the site.
on:
  push:
    branches: [master]
  schedule:
    # 02:23 UTC. Two things have to have happened before a rebuild is worth
    # doing, and both are why this is not an earlier or rounder time:
    #   1. The backend's own league sync runs `@daily` in a UTC container, i.e.
    #      00:00 UTC, and takes a while to walk every league.
    #   2. The public API is fronted by Cloudflare with `s-maxage=1800`, so
    #      fresh rows stay hidden behind the edge for up to 30 more minutes.
    # Building before both settle silently bakes yesterday's data into the HTML.
    # The odd minute is deliberate: scheduled runs queue behind everyone else's
    # on the hour.
    - cron: "23 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Never let two deploys push assets to the same Worker at once. Queue instead
  # of cancelling — a half-uploaded deploy is worse than a late one. This is
  # airtight only because Cloudflare's Git builds are off; while both paths were
  # live nothing could stop them deploying on top of each other.
  group: web-deploy
  cancel-in-progress: false

jobs:
  rebuild:
    name: Build and deploy the static site
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Chinese font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-microhei
          sudo fc-cache -f
          fc-match "WenQuanYi Micro Hei"

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # No cache to clear here: a fresh runner has no .next/cache, so Next
      # cannot replay stale API responses into the export the way a local
      # rebuild can. Do not add a build cache to this job.
      - name: Build static export
        working-directory: web
        run: npm run build

      - name: Deploy to Cloudflare
        working-directory: web
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  keepalive:
    name: Keep the schedule from being auto-disabled
    runs-on: ubuntu-24.04
    # GitHub disables scheduled workflows in a public repository after 60 days
    # with no activity, and this one is the site's only path to fresh data: a
    # static export bakes fixtures into the HTML, so a disabled schedule freezes
    # the public site on whatever day it stopped — silently, because a workflow
    # that never runs reports nothing. The push trigger covers active stretches;
    # this covers the quiet ones, by giving the repo the activity it is being
    # judged on. An empty commit is enough, and GITHUB_TOKEN pushes do not fire
    # workflow triggers, so it cannot recurse into another deploy.
    if: github.event_name == 'schedule'
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Push an empty commit if the repo has gone quiet
        env:
          # 45, not 59: the schedule itself is what would be lost, so the margin
          # has to absorb runs GitHub skips or delays (scheduled runs here queue
          # 5-7 hours behind their cron time already).
          QUIET_DAYS_BEFORE_PING: 45
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit: $days day(s) ago (threshold: $QUIET_DAYS_BEFORE_PING)."
          if [ "$days" -lt "$QUIET_DAYS_BEFORE_PING" ]; then
            echo "Recent enough — the 60-day clock is not a concern yet."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --allow-empty \
              -m "chore: keep the nightly web rebuild from being auto-disabled" \
              -m "No code change. GitHub disables scheduled workflows after 60 days of repository inactivity, and the nightly rebuild is how database changes reach the static site. Pushed automatically by the keepalive job in .github/workflows/web-rebuild.yml."
          git push origin "HEAD:$BRANCH"
          echo "Pushed an empty commit; the inactivity clock is reset."
